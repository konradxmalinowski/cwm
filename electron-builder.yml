# Konfiguracja wydania dla czterech celow (ADR 0002, ADR 0010).
# Wydania w MVP sa niepodpisane swiadomie (ADR 0003): zero sekretow w CI,
# zero autoaktualizacji, weryfikacja przez SHA256SUMS.

appId: io.github.universal-ai-skills-manager
productName: Universal AI Skills Manager
copyright: ''

directories:
  output: release
  buildResources: resources

# Do paczki ida tylko artefakty builda i manifest. Angular jest zaleznoscia
# wylacznie budowania - jego kod ladnie siedzi w bundlu renderera, wiec nie ma
# po co kopiowac zrodel do aplikacji.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'

# Nazwy plikow wydania bez spacji. GitHub zamienia spacje w nazwach zasobow na kropki, wtedy
# nazwy w SHA256SUMS nie zgadzaly by sie z plikami do pobrania i `sha256sum -c` padal u uzytkownika.
artifactName: universal-ai-skills-manager-${version}-${os}-${arch}.${ext}

asar: true
# Modul natywny musi lezec poza archiwum asar, bo `dlopen` nie otworzy pliku
# .node ze srodka asara (ADR 0007).
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# `better-sqlite3` 13 dostarcza w paczce npm prebuildy N-API dla wszystkich
# szesciu par system-architektura, ktore nas interesuja. N-API jest stabilne
# miedzy Node i Electronem, wiec przebudowa jest zbedna, a jej uruchamianie
# wymagaloby pelnego toolchainu na kazdym runnerze bez zadnego zysku.
# Gdyby kiedys zabraklo prebuildu dla jakiejs pary, ratunkiem jest
# `npm run rebuild:native` i powrot do `npmRebuild: true`.
npmRebuild: false
buildDependenciesFromSource: false

mac:
  category: public.app-category.developer-tools
  icon: resources/icons/icon.icns
  # Architektura przychodzi z wiersza polecen (`--arm64`, `--x64`), nie z tej listy. Lista
  # architektur w pliku wygrywala z flaga, wiec kazdy z dwoch runnerow macOS w release.yml
  # budowal oba DMG o tych samych nazwach, a scalone SHA256SUMS mialo po dwie rozne sumy dla
  # jednego pliku. Bez flagi buduje sie architektura maszyny.
  target:
    - dmg
    - zip
  # Brak podpisu i brak notaryzacji: ADR 0003. Gatekeeper bedzie ostrzegal,
  # instrukcja obejscia jest w README.
  identity: null
  notarize: false
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  icon: resources/icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

portable:
  artifactName: universal-ai-skills-manager-${version}-portable-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: universal-ai-skills-manager-${version}-setup-${arch}.${ext}

linux:
  category: Development
  maintainer: universal-ai-skills-manager
  # Przypiete jawnie, bo nazwa binarki jest uzywana przez testy E2E
  # (tests/e2e/launch.ts). Domyslna wartosc pochodzi z productName, ktory ma
  # spacje - a wtedy szukanie binarki po nazwie staje sie zgadywaniem.
  executableName: universal-ai-skills-manager
  # Katalog z plikami NxN.png (16 do 512); electron-builder wybiera z niego rozmiary.
  icon: resources/icons/linux
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

# Autoaktualizacja jest wylaczona (ADR 0003, ARCHITECTURE 14.3), wiec nie generujemy plikow
# latest*.yml. Dwa runnery macOS tworzyly oba `latest-mac.yml` o tej samej nazwie i jeden
# nadpisywal drugi; zadna funkcja z nich nie korzysta. Wlaczenie autoaktualizacji (backlog po
# podpisaniu) wymaga tu `publish` z dostawca i osobnego scalania plikow `latest-mac.yml`.
publish: null
