name: Bug report
description: Something does not work as documented
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste real tokens, credentials or private configuration.
        Security problems go through the private channel in SECURITY.md, not here.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app
        - cwm CLI
        - Documentation
        - Release or installer
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, or commit hash if built from source.
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error text. For the CLI, include the command and exit code.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics report
      description: |
        In the desktop app open Diagnostics, choose "Eksportuj raport" (or press E), read the preview, save the file and paste its contents here. Paths, names of library items, hosts, e-mail addresses and secrets are replaced with placeholders, and the list of rules is at the top of the report. The redaction is automatic, so read the report before posting. The report is written in Polish.
        For the CLI, paste the output of `cwm doctor` instead, with private paths and names removed.
      render: text
