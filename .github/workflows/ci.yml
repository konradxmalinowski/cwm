name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # Bramki niezalezne od systemu. Lint, formatowanie, granice warstw i audyt
  # zaleznosci daja ten sam wynik na kazdym runnerze, wiec jada raz.
  quality:
    name: Lint, typy, granice warstw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Lint i formatowanie
        run: npm run lint

      - name: Kontrola typow
        run: npm run typecheck

      # Regula granic warstw, ktorej nikt nie sprawdzil, nie jest regula:
      # ten krok wstawia celowo zakazany import i wymaga, zeby lint padl.
      - name: Dowod, ze granice warstw blokuja
        run: npm run test:boundaries

      - name: Audyt zaleznosci produkcyjnych
        run: npm audit --omit=dev --audit-level=high

      - name: Audyt pelnego drzewa (informacyjnie)
        run: npm audit --audit-level=high || true

  # Ryzyko S7: publiczne repozytorium jest nieodwracalnym kanalem wycieku,
  # wiec skan idzie po calej historii, nie po samym drzewie roboczym.
  secrets-scan:
    name: Skan sekretow (cala historia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalacja gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Skan historii
        run: ./gitleaks git . --no-banner --redact --config .gitleaks.toml --exit-code 1 --log-opts="--all --full-history"

  # Macierz czterech celow (ADR 0010). Cztery wpisy, nie trzy, bo
  # better-sqlite3 jest modulem natywnym, a macOS arm64 i x64 to osobne cele.
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Ostatnie zabezpieczenie; zwykle 4-6 min. Zawis E2E ma pasc wczesniej,
    # na limicie kroku, bo anulowany job nie wysyla artefaktu raportu.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalacja zaleznosci
        run: npm ci

      # Paczka npm `electron` nie ma skryptu instalacyjnego - binarka jest
      # pobierana leniwie, przy pierwszym uzyciu. Bez tego kroku katalog
      # node_modules/electron/dist nie istnieje jeszcze w momencie, w ktorym
      # nadajemy uprawnienia pomocnikowi sandboxa, a pobieranie wchodzi
      # w pierwszy test E2E i wyglada jak jego timeout.
      #
      # Wprost `install.js`, a nie `npx electron --version`: ten drugi
      # uruchamia Chromium, ktore na Linuksie przewraca sie na nieustawionym
      # pomocniku SUID jeszcze przed krokiem nadajacym mu uprawnienia.
      # Downloader sam niczego nie uruchamia.
      - name: Pobranie binarki Electrona
        run: node node_modules/electron/install.js

      - name: Kontrola typow
        run: npm run typecheck

      - name: Testy jednostkowe, kontraktowe i integracyjne
        run: npm test

      - name: Build aplikacji
        run: npm run build

      # Paczka probna idzie przed testami E2E swiadomie: dwa testy w
      # tests/e2e/packaged-app.spec.ts uruchamiaja faktycznie zapakowana
      # aplikacje i tylko one potwierdzaja, ze modul natywny laduje sie
      # z app.asar.unpacked. Bez paczki byly by pominiete.
      - name: Build probny paczki
        run: npm run package

      # Testy E2E jada z wlaczonym sandboxem Chromium (chromiumSandbox w
      # tests/e2e/launch.ts), bo inaczej Playwright sam dokladalby
      # `--no-sandbox` i test hartowania milczalby o tym. Na Linuksie
      # zapakowany Electron potrzebuje do tego pomocnika z bitem setuid:
      # Ubuntu 24.04 blokuje nieuprzywilejowane przestrzenie nazw przez
      # AppArmor, wiec sciezka namespace jest niedostepna.
      - name: Pomocnik chrome-sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Dwie kopie, obie potrzebne: testy przeciw dist/ uruchamiaja
          # Electrona z node_modules, testy przeciw paczce - binarke z release/.
          # Pominiecie jednej z nich konczy sie tym, ze polowa testow pada na
          # komunikacie o niepoprawnie skonfigurowanym pomocniku SUID.
          found=0
          while IFS= read -r helper; do
            sudo chown root:root "$helper"
            sudo chmod 4755 "$helper"
            ls -l "$helper"
            found=$((found + 1))
          done < <(find node_modules/electron/dist release -name chrome-sandbox -type f 2>/dev/null)
          # Obie kopie musza byc obsluzone. Jedna to za malo i konczy sie
          # polowa padnietych testow, wiec brak drugiej jest bledem, nie
          # ostrzezeniem.
          if [ "$found" -lt 2 ]; then
            echo "oczekiwalem dwoch kopii chrome-sandbox (node_modules i release), mam $found"
            find node_modules/electron release -maxdepth 3 -name 'chrome-sandbox*' 2>/dev/null || true
            exit 1
          fi
          echo "skonfigurowano kopii pomocnika: $found"

      - name: Testy E2E (Linux, pod xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Testy E2E
        if: runner.os != 'Linux'
        timeout-minutes: 15
        run: npm run test:e2e

      - name: Raport E2E przy porazce
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.target }}
          path: playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # Etap 9 kryterium 6: build produkcyjny, ten sam co w release.yml (bez tagu i bez publikacji),
  # zainstalowany tak, jak zrobi to uzytkownik, i uruchomiony testem dymnym
  # (tests/smoke/dist-smoke.test.ts). Osobny job, a nie kroki po E2E: czerwony test E2E nie moze
  # zaslonic dowodu, ze paczka startuje. Paczka probna `--dir` tego nie dowodzi, bo nie
  # przechodzi przez DMG, instalator NSIS ani pakiet deb.
  dist:
    name: paczka ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            dist_args: --linux --x64
          - os: macos-15
            target: macos-arm64
            dist_args: --mac --arm64
            mac_arch: arm64
          - os: macos-15-intel
            target: macos-x64
            dist_args: --mac --x64
            mac_arch: x86_64
          - os: windows-latest
            target: windows-x64
            dist_args: --win --x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalacja zaleznosci
        run: npm ci

      - name: Build aplikacji
        run: npm run build

      - name: Paczka dystrybucyjna
        timeout-minutes: 10
        run: npx electron-builder ${{ matrix.dist_args }} --publish never

      - name: Sumy kontrolne paczki dystrybucyjnej
        shell: bash
        run: |
          set -euo pipefail
          node scripts/checksums.mjs release release/SHA256SUMS
          cd release
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi

      - name: Instalacja z DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmgs=(release/*.dmg)
          # Jeden DMG na runner: architektura idzie z flagi, nie z electron-builder.yml.
          if [ "${#dmgs[@]}" -ne 1 ]; then echo "oczekiwalem jednego DMG, mam: ${dmgs[*]}"; exit 1; fi
          mnt="$RUNNER_TEMP/cwm-dmg"
          apps="$RUNNER_TEMP/Applications"
          mkdir -p "$mnt" "$apps"
          hdiutil attach "${dmgs[0]}" -nobrowse -readonly -mountpoint "$mnt"
          ditto "$mnt/CWM - Claude Workspace Manager.app" "$apps/CWM - Claude Workspace Manager.app"
          hdiutil detach "$mnt"
          exe="$apps/CWM - Claude Workspace Manager.app/Contents/MacOS/CWM - Claude Workspace Manager"
          archs="$(lipo -archs "$exe")"
          echo "architektura binarki: $archs"
          if [ "$archs" != "${{ matrix.mac_arch }}" ]; then echo "oczekiwalem ${{ matrix.mac_arch }}"; exit 1; fi
          echo "CWM_DIST_EXECUTABLE=$exe" >> "$GITHUB_ENV"

      - name: Instalacja instalatorem NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter '*-setup-x64.exe' | Select-Object -First 1
          if ($null -eq $setup) { throw 'brak instalatora NSIS w release/' }
          $dir = Join-Path $env:RUNNER_TEMP 'cwm-install'
          # /S: instalacja cicha, /D: katalog docelowy (musi byc ostatni i bez cudzyslowow).
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "instalator zakonczyl sie kodem $($proc.ExitCode)" }
          Get-Process -Name 'CWM - Claude Workspace Manager' -ErrorAction SilentlyContinue | Stop-Process -Force
          $exe = Join-Path $dir 'CWM - Claude Workspace Manager.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse $dir | Select-Object -First 40; throw "brak $exe" }
          "CWM_DIST_EXECUTABLE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Instalacja pakietu deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          debs=(release/*.deb)
          sudo apt-get install -y "./${debs[0]}"
          exe="$(dpkg -L claude-workspace-manager | grep -E '^/opt/.*/claude-workspace-manager$' | head -1)"
          ls -l "$exe" "$(dirname "$exe")/chrome-sandbox"
          echo "CWM_DIST_EXECUTABLE=$exe" >> "$GITHUB_ENV"

      - name: Test dymny paczki dystrybucyjnej (Linux, pod xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: xvfb-run --auto-servernum npx vitest run -c vitest.dist.config.ts

      - name: Test dymny paczki dystrybucyjnej
        if: runner.os != 'Linux'
        timeout-minutes: 5
        run: npx vitest run -c vitest.dist.config.ts

      # AppImage nie ma pomocnika sandboxa z bitem setuid, a Ubuntu 24.04 blokuje przestrzenie
      # nazw przez AppArmor. Krok mierzy, czy rozpakowany AppImage startuje bez --no-sandbox;
      # wynik idzie do README w Etapie 10, a dowodem dla Linuksa jest pakiet deb wyzej.
      - name: AppImage bez --no-sandbox (Linux, informacyjnie)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          app="$(ls "$GITHUB_WORKSPACE"/release/*.AppImage)"
          chmod +x "$app"
          (cd "$RUNNER_TEMP" && "$app" --appimage-extract >/dev/null)
          CWM_DIST_EXECUTABLE="$RUNNER_TEMP/squashfs-root/claude-workspace-manager" \
            xvfb-run --auto-servernum npx vitest run -c vitest.dist.config.ts
